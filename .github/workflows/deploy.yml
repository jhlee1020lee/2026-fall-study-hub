name: Validate and deploy study hub

# Public deployment is allowed only after the repository safety validator passes.

on:
  push:
    branches: [v5]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Reject private or unreviewed content
        run: python scripts/validate_public.py
      - name: Test publication safeguards
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Install dependencies
        run: npm ci
      - name: Install locked Quartz plugins
        run: npx quartz plugin install
      - name: Check TypeScript and test Quartz
        run: |
          npx tsc --noEmit --incremental false
          npm test
      - name: Build Quartz
        run: npx quartz build
      - name: Stage committed page-cache manifests and PNGs
        run: python scripts/stage_page_cache_for_pages.py --public public
      - name: Mirror public release assets into Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/download_release_assets.py --output public/materials
      - name: Check generated internal links and assets
        run: |
          python scripts/validate_links.py --public public \
            --site-base "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
